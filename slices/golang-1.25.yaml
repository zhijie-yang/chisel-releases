package: golang-1.25

essential:
  golang-1.25_copyright:

slices:
  core:
    essential:
      # Note: Package golang-1.25-go is not available on i386.
      golang-1.25-go_core:
      golang-1.25-src_src-with-tests:

  cgo-support:
    essential:
      golang-1.25-go_cgo-tools:
      golang-1.25_core:

  symlinks:
    essential:
      golang-1.25_core:
    contents:
      /usr/bin/go:
        symlink: ../lib/go-1.25/bin/go
        prefer: golang-go
      /usr/bin/gofmt:
        symlink: ../lib/go-1.25/bin/gofmt
        prefer: golang-go
      /usr/lib/go:
        symlink: ../share/go-1.25
        prefer: golang-go

  copyright:
    contents:
      /usr/share/doc/golang-1.25/copyright:
